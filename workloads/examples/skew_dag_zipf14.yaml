schema_version: 0.1
workload_name: skew_dag_zipf14
description: >
  Zipf-heavy (alpha≈1.4) variant of the KV DAG workload. The db_lookup node inherits a long-tail
  key distribution so host-pinned placement keeps re-touching the same hot rows (high host_link +
  DRAM pressure) while NIC placement pushes lookups across the DPA fabric.
tasks:
  - id: 902
    arrival_time: 0.0
    dag:
      nodes:
        - name: parse_req
          stage:
            deterministic_service_time: 0.8
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 1.5e7
            bytes_in: 2048
            bytes_out: 1536
            demands:
              - resource: host_cpu
                units: 0.6
              - resource: host_dram
                units: 0.2
          successors:
            - hash_key
            - auth_check
        - name: hash_key
          stage:
            deterministic_service_time: 1.0
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 3e7
            bytes_in: 1536
            bytes_out: 512
            demands:
              - resource: host_cpu
                units: 1.0
          successors:
            - db_lookup
        - name: db_lookup
          stage:
            service_profile:
              key: kv_lookup_zipf14
              domain: host
              mode: stochastic
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 2.2e8
            bytes_in: 4096
            bytes_out: 32768
            demands:
              - resource: host_cpu
                units: 4.2
              - resource: host_dram
                units: 5.0
              - resource: host_link
                units: 65536
          successors:
            - serialize_resp
        - name: auth_check
          stage:
            deterministic_service_time: 0.6
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 5e6
            bytes_in: 512
            bytes_out: 512
            demands:
              - resource: host_cpu
                units: 0.4
          successors:
            - serialize_resp
        - name: serialize_resp
          stage:
            deterministic_service_time: 1.4
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 1.7e7
            bytes_in: 32768
            bytes_out: 4096
            demands:
              - resource: host_cpu
                units: 1.2
              - resource: host_dram
                units: 0.5
      entry_points:
        - parse_req
