schema_version: 0.1
workload_name: skew_dag_zipf18
description: >
  More extreme Zipf-heavy (alpha≈1.8) variant that further amplifies db_lookup
  CPU/link pressure so host-pinned runs thrash whereas NIC placement keeps
  latency flat.
tasks:
  - id: 903
    arrival_time: 0.0
    dag:
      nodes:
        - name: parse_req
          stage:
            deterministic_service_time: 0.8
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 1.5e7
            bytes_in: 2048
            bytes_out: 1536
            demands:
              - resource: host_cpu
                units: 0.6
              - resource: host_dram
                units: 0.2
          successors:
            - hash_key
            - auth_check
        - name: hash_key
          stage:
            deterministic_service_time: 1.0
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 3.5e7
            bytes_in: 1536
            bytes_out: 512
            demands:
              - resource: host_cpu
                units: 1.1
          successors:
            - db_lookup
        - name: db_lookup
          stage:
            service_profile:
              key: kv_lookup_zipf18
              domain: host
              mode: stochastic
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 3.2e8
            bytes_in: 4096.0
            bytes_out: 49152.0
            demands:
              - resource: host_cpu
                units: 5.0
              - resource: host_dram
                units: 6.0
              - resource: host_link
                units: 131072.0
          successors:
            - serialize_resp
        - name: auth_check
          stage:
            deterministic_service_time: 0.6
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 5e6
            bytes_in: 512
            bytes_out: 512
            demands:
              - resource: host_cpu
                units: 0.4
          successors:
            - serialize_resp
        - name: serialize_resp
          stage:
            deterministic_service_time: 1.6
            placement_default: host
            placement_eligible:
              - host
              - nic
            instructions: 2e7
            bytes_in: 49152.0
            bytes_out: 4096.0
            demands:
              - resource: host_cpu
                units: 1.4
              - resource: host_dram
                units: 0.6
      entry_points:
        - parse_req
