              - host
              - nic
            demands:
              - resource: host_cpu
                units: 10.0
              - resource: nic_cpu
                units: 6.0
          successors:
            - serialize_resp
        - name: serialize_resp
          stage:
            deterministic_service_time: 2.0
            placement_default: host
            placement_eligible:
              - host
              - nic
            demands:
              - resource: host_cpu
                units: 2.0
      entry_points:
        - db_lookup
